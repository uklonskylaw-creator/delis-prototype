<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Сотрудники — Делись</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Unbounded:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../css/tokens.css">
<link rel="stylesheet" href="../../css/base.css">
<link rel="stylesheet" href="../../css/main.css">
<link rel="stylesheet" href="../../css/cabinet.css?v=20260914i">
</head>
<body class="cabinet-page cabinet-page--app">

<div id="cab-header"></div>

<main>
  <div class="cabinet-shell">
    <div class="cabinet-breadcrumbs"><a href="../../index.html">Главная</a> / Личный кабинет / Сотрудники</div>
    <h1 class="cabinet-title">Личный кабинет</h1>

    <div class="cabinet-layout">
      <div id="cab-sidebar-slot"></div>

      <div class="cab-main">
        <div class="cab-bare">
          <div class="cab-card__head">
            <div class="cab-card__title">Сотрудники</div>
          </div>

          <!-- Тулбар: поиск + Все фильтры + Пригласить -->
          <div class="cab-toolbar-row">
            <div class="cab-toolbar-row__search">
              <input type="text" placeholder="Поиск по ФИО, телефону...">
              <button class="cab-filter-toggle" onclick="toggleFilter()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="18" x2="14" y2="18"/><circle cx="16" cy="6" r="2.5" fill="#fff"/><circle cx="9" cy="12" r="2.5" fill="#fff"/><circle cx="17" cy="18" r="2.5" fill="#fff"/></svg>
                Все фильтры
              </button>
            </div>
            <button class="btn btn--brand" type="button" onclick="openInvite()">+ Пригласить</button>

            <!-- Раскрывающаяся панель фильтров (поверх) -->
            <div class="cab-filter">
            <div class="cab-filter__head">
              <div class="cab-filter__title">Поиск</div>
              <button onclick="toggleFilter()" style="background:none;border:none;display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:14px;cursor:pointer;color:#282828;">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18"><line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="18" x2="14" y2="18"/><circle cx="16" cy="6" r="2.5" fill="#fff"/><circle cx="9" cy="12" r="2.5" fill="#fff"/><circle cx="17" cy="18" r="2.5" fill="#fff"/></svg>
                Все фильтры
              </button>
            </div>
            <div class="cab-filter__grid">
              <div class="cab-filter__field"><span class="cab-filter__field-label">ФИО</span><input type="text"></div>
              <div class="cab-filter__field"><span class="cab-filter__field-label">Должность</span><select><option>Любая</option><option>Риелтор</option><option>Юрист</option><option>Менеджер</option></select></div>
              <div class="cab-filter__field"><span class="cab-filter__field-label">Статус</span><select><option>Любой</option><option>Активен</option><option>В архиве</option></select></div>
            </div>
            <div class="cab-filter__foot">
              <button onclick="toggleFilter()">Свернуть ⌃</button>
              <button onclick="resetFilter()">Сбросить ×</button>
            </div>
            </div>
          </div>

          <div class="cl-list emp-list">
            <div class="cl-list__head emp-list__head">
              <div class="cl-cell">Фото</div>
              <div class="cl-cell">ФИО | Роль</div>
              <div class="cl-cell">Контакты</div>
              <div class="cl-cell">Создан <span style="opacity:.6;">↕</span></div>
              <div class="cl-cell">Объекты <span style="opacity:.6;">↕</span></div>
              <div class="cl-cell"></div>
            </div>
            <div id="emp-rows"></div>
          </div>
          <div class="cab-pagination">
            <button>‹</button>
            <button class="is-active">1</button>
            <button>2</button>
            <button>›</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</main>

<!-- ===== Модалка: Пригласить сотрудника ===== -->
<div class="cab-modal-backdrop" id="modal-emp">
  <div class="cab-modal">
    <div class="cab-modal__head">
      <div class="cab-modal__tabs"><span class="cab-modal__tab cab-modal__tab--active">Пригласить сотрудника</span></div>
      <button class="auth-card__close" onclick="closeInvite()">×</button>
    </div>
    <form class="auth-form" id="form-invite" onsubmit="submitInvite(event)">
      <div class="auth-row">
        <div class="auth-field"><label class="auth-field__label">Фамилия</label><input type="text" name="last" required></div>
        <div class="auth-field"><label class="auth-field__label">Имя</label><input type="text" name="first" required></div>
      </div>
      <div class="auth-row">
        <div class="auth-field"><label class="auth-field__label">Должность</label>
          <select name="role" required><option value="">Выбрать</option><option>Риелтор</option><option>Юрист</option><option>Менеджер</option><option>Руководитель отдела продаж</option></select>
        </div>
        <div class="auth-field"><label class="auth-field__label">Телефон</label><input type="tel" name="phone" placeholder="+7 (___) ___-__-__" required></div>
      </div>
      <div class="auth-field auth-field--full"><label class="auth-field__label">Почта</label><input type="email" name="email" required></div>
      <div class="auth-actions" style="margin-top:18px;">
        <button type="button" class="pf-modal__cancel" onclick="closeInvite()">Отмена</button>
        <button type="submit" class="btn btn--dark">Пригласить</button>
      </div>
    </form>
  </div>
</div>

<div class="snackbar" id="snackbar"></div>

<script src="_layout.js"></script>
<script>
mountCabinet('employees');
function toggleFilter() { document.querySelector('.cab-filter').classList.toggle('is-open'); }
function resetFilter() { document.querySelectorAll('.cab-filter input, .cab-filter select').forEach(x => x.value = ''); }
function snackbar(msg, variant='') {
  const el = document.getElementById('snackbar');
  el.textContent = msg;
  el.className = 'snackbar snackbar--visible' + (variant ? ' snackbar--' + variant : '');
  setTimeout(() => el.className = 'snackbar', 3000);
}

const EMPLOYEES = [
  { name: 'Хьюберт Блейн Вольфешлегельштейн', role: 'Руководитель отдела продаж', phone: '+7 (999) 000-00-02', email: 'office@delis.example', created: '01.01.25', objects: 200, requests: 200, photo: '../../images/form-person.png' },
  { name: 'Хьюберт Блейн Вольфешлегельштейн', role: 'Руководитель отдела продаж', phone: '+7 (999) 000-00-02', email: 'office@delis.example', created: '01.01.25', objects: 200, requests: 200, photo: '../../images/form-person.png' },
  { name: 'Хьюберт Блейн Вольфешлегельштейн', role: 'Руководитель отдела продаж', phone: '+7 (999) 000-00-02', email: 'office@delis.example', created: '01.01.25', objects: 200, requests: 200, photo: '../../images/form-person.png' },
  { name: 'Хьюберт Блейн Вольфешлегельштейн', role: 'Руководитель отдела продаж', phone: '+7 (999) 000-00-02', email: 'office@delis.example', created: '01.01.25', objects: 200, requests: 200, photo: '../../images/form-person.png' }
];
function renderEmployees() {
  document.getElementById('emp-rows').innerHTML = EMPLOYEES.map(e => `
  <div class="cl-row emp-row">
    <div class="cl-cell"><img class="emp-photo" src="${e.photo}" alt=""></div>
    <div class="cl-cell">
      <div class="emp-name">${e.name}</div>
      <span class="emp-role">${e.role}</span>
    </div>
    <div class="cl-cell emp-contacts">
      <div><span style="color:#9A9A9F;">Тел.:</span> ${e.phone}</div>
      <div><span style="color:#9A9A9F;">Почта:</span> ${e.email}</div>
    </div>
    <div class="cl-cell"><span style="color:#9A9A9F;">Создан:</span> <strong style="font-weight:500;">${e.created}</strong></div>
    <div class="cl-cell emp-stats">
      <div><span style="color:#9A9A9F;">Число объектов:</span> <strong style="font-weight:600;">${e.objects}</strong></div>
      <div><span style="color:#9A9A9F;">Число запросов:</span> <strong style="font-weight:600;">${e.requests}</strong></div>
    </div>
    <div class="cl-cell"><button class="cl-edit-btn" title="Редактировать"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg></button></div>
  </div>
`).join('');
}
renderEmployees();

// === Модалка приглашения ===
function openInvite()  { document.getElementById('modal-emp').classList.add('is-open'); }
function closeInvite() { document.getElementById('modal-emp').classList.remove('is-open'); }
document.getElementById('modal-emp').addEventListener('click', (e) => { if (e.target.id === 'modal-emp') closeInvite(); });

function submitInvite(e) {
  e.preventDefault();
  const f = new FormData(e.target);
  EMPLOYEES.unshift({
    name: `${f.get('last')} ${f.get('first')}`,
    role: f.get('role'),
    phone: f.get('phone'),
    email: f.get('email'),
    created: new Date().toLocaleDateString('ru-RU', { day: '2-digit', month: '2-digit', year: '2-digit' }),
    objects: 0, requests: 0,
    photo: '../../images/form-person.png'
  });
  renderEmployees();
  closeInvite();
  snackbar('Приглашение отправлено', 'success');
  e.target.reset();
}
</script>
</body>
</html>
