<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Клиенты — Делись</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Unbounded:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../css/tokens.css">
<link rel="stylesheet" href="../../css/base.css">
<link rel="stylesheet" href="../../css/main.css">
<link rel="stylesheet" href="../../css/cabinet.css?v=20260915q">
</head>
<body class="cabinet-page cabinet-page--app">

<div id="cab-header"></div>

<main>
  <div class="cabinet-shell">
    <div class="cabinet-breadcrumbs"><a href="../../index.html">Главная</a> • Личный кабинет • Клиенты</div>
    <h1 class="cabinet-title">Личный кабинет</h1>

    <div class="cabinet-layout">
      <div id="cab-sidebar-slot"></div>

      <div class="cab-main">
        <div class="cab-bare">
          <div class="cab-card__head">
            <div class="cab-card__title">Клиенты</div>
          </div>

          <div class="cab-text-tabs" id="cl-tabs">
            <button class="cab-text-tab cab-text-tab--active" data-tab="requests">Запросы<sup class="cab-text-tab__count">10</sup></button>
            <button class="cab-text-tab" data-tab="fixations">Фиксации<sup class="cab-text-tab__count">0</sup></button>
            <button class="cab-text-tab" data-tab="give">Передача клиента<sup class="cab-text-tab__count">0</sup></button>
            <button class="cab-text-tab" data-tab="take">Получение клиента<sup class="cab-text-tab__count">0</sup></button>
          </div>

          <!-- Тулбар: поиск + Все фильтры + toggle + Создать запрос -->
          <div class="cab-toolbar-row">
            <div class="cab-toolbar-row__search">
              <input type="text" placeholder="Поиск по ФИО, телефону, почте">
              <button class="cab-filter-toggle" onclick="toggleFilter()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="18" x2="14" y2="18"/><circle cx="16" cy="6" r="2.5" fill="#fff"/><circle cx="9" cy="12" r="2.5" fill="#fff"/><circle cx="17" cy="18" r="2.5" fill="#fff"/></svg>
                Все фильтры
              </button>
            </div>
            <label class="cab-toolbar-toggle">
              <input type="checkbox" checked>
              <span class="cab-toolbar-toggle__slider"></span>
              Сначала запросы моего агентства
            </label>
            <button class="btn btn--brand" onclick="openAddClient()">+ Создать запрос</button>

            <!-- Раскрывающаяся панель фильтров (поверх) -->
            <div class="cab-filter">
            <div class="cab-filter__head">
              <div class="cab-filter__title">Поиск</div>
              <button onclick="toggleFilter()" style="background:none;border:none;display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:14px;cursor:pointer;color:#282828;">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18"><line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="18" x2="14" y2="18"/><circle cx="16" cy="6" r="2.5" fill="#fff"/><circle cx="9" cy="12" r="2.5" fill="#fff"/><circle cx="17" cy="18" r="2.5" fill="#fff"/></svg>
                Все фильтры
              </button>
            </div>
            <div class="cab-filter__grid">
              <div class="cab-filter__field"><span class="cab-filter__field-label">ФИО клиента</span><input type="text"></div>
              <div class="cab-filter__field"><span class="cab-filter__field-label">Где ищет:</span><select><option>Выбрать город</option><option>Санкт-Петербург</option><option>Москва</option></select></div>
              <div class="cab-filter__field"><span class="cab-filter__field-label">Где ищет:</span><select><option>Выбрать район</option><option>Центральный</option><option>Приморский</option></select></div>
              <div class="cab-filter__field"><span class="cab-filter__field-label">Цена объекта</span><div class="cab-filter__range"><input type="text" placeholder="от"><input type="text" placeholder="до"></div></div>
              <div class="cab-filter__field"><span class="cab-filter__field-label">Площадь, в м²</span><div class="cab-filter__range"><input type="text" placeholder="от"><input type="text" placeholder="до"></div></div>
              <div class="cab-filter__field"><span class="cab-filter__field-label">Бюджет</span><div class="cab-filter__range"><input type="text" placeholder="от"><input type="text" placeholder="до"></div></div>
            </div>
            <div class="cab-filter__foot">
              <button onclick="toggleFilter()">Свернуть ⌃</button>
              <button onclick="resetFilter()">Сбросить ×</button>
            </div>
            </div>
          </div>

          <div class="cl-list" id="cl-list">
            <div class="cl-list__head">
              <div class="cl-cell cl-cell--name">ФИО</div>
              <div class="cl-cell cl-cell--phone">Контакты</div>
              <div class="cl-cell cl-cell--date">Создан <span style="opacity:.6;">↕</span></div>
              <div class="cl-cell cl-cell--match"></div>
              <div class="cl-cell cl-cell--act"></div>
            </div>
            <div id="cl-rows"></div>
          </div>
          <div class="cab-pagination">
            <button>‹</button><button class="is-active">1</button><button>2</button><button>›</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</main>

<!-- ===== Modal: Создать / Выбрать клиента ===== -->
<div class="cab-modal-backdrop" id="modal-client">
  <div class="cab-modal cab-modal--wide">
    <div class="cab-modal__head">
      <div class="cab-modal__tabs">
        <button class="cab-modal__tab cab-modal__tab--active" data-mtab="create">Создать клиента</button>
        <button class="cab-modal__tab" data-mtab="select">Выбрать клиента</button>
      </div>
      <button class="auth-card__close" onclick="closeClientModal()">×</button>
    </div>

    <!-- Tab: Создать клиента (короткая форма) -->
    <form class="auth-form" id="form-create-client" data-modal-tab="create" onsubmit="submitCreateClient(event)">
      <div class="auth-row">
        <div class="auth-field"><label class="auth-field__label">Фамилия</label><input type="text" name="last" required></div>
        <div class="auth-field" data-name="first">
          <label class="auth-field__label">Имя</label>
          <input type="text" name="first" required pattern="^[А-ЯЁ][а-яё-]+$">
          <span class="auth-field__error">Некорректное имя</span>
        </div>
      </div>
      <div class="auth-row">
        <div class="auth-field"><label class="auth-field__label">Отчество</label><input type="text" name="middle"></div>
        <div class="auth-field"><label class="auth-field__label">Телефон клиента</label><input type="tel" name="phone" placeholder="+7 (___) ___-__-__" required></div>
      </div>
      <div class="auth-actions" style="margin-top:18px;">
        <label class="auth-check">
          <input type="checkbox" required>
          <span class="auth-check__box"></span>
          <span style="font-size:11px;">Нажимая на кнопку «Отправить», я соглашаюсь с <a href="#">Политикой обработки персональных данных</a></span>
        </label>
        <button type="submit" class="btn btn--dark">Отправить</button>
      </div>
    </form>

    <!-- Tab: Выбрать клиента (полная форма запроса) -->
    <form class="auth-form" id="form-select-client" data-modal-tab="select" style="display:none;" onsubmit="submitSelectClient(event)">
      <div class="auth-row">
        <div class="auth-field"><label class="auth-field__label">Где ищет:</label><select required><option>Выбрать город</option><option>Санкт-Петербург</option><option>Москва</option></select></div>
        <div class="auth-field"><label class="auth-field__label">Где ищет:</label><select required><option>Выбрать район</option><option>Центральный</option><option>Приморский</option></select></div>
      </div>
      <div class="auth-row">
        <div class="auth-field"><label class="auth-field__label">Что ищет:</label><select required><option>Тип недвижимости</option><option>Квартира</option><option>Студия</option><option>Коммерческая</option></select></div>
        <div class="auth-field"><label class="auth-field__label">Максимальное время до метро, в мин.</label><input type="text" placeholder="до" required></div>
      </div>
      <div class="auth-row">
        <div class="auth-field"><label class="auth-field__label">Цена объекта</label><div class="cab-filter__range"><input type="text" placeholder="от"><input type="text" placeholder="до"></div></div>
        <div class="auth-field"><label class="auth-field__label">Площадь, в м²</label><div class="cab-filter__range"><input type="text" placeholder="от"><input type="text" placeholder="до"></div></div>
      </div>
      <div class="auth-field auth-field--full">
        <label class="auth-field__label">Желаемый бонус</label>
        <input type="text" placeholder="до">
      </div>
      <div class="auth-field auth-field--full">
        <label class="auth-field__label">Описание запроса</label>
        <input type="text" placeholder="Принимая во внимание показатели успешности, существующая теория создаёт…">
      </div>
      <div class="auth-row">
        <div class="auth-field"><label class="auth-field__label">Срок запроса</label><input type="text" placeholder="до"></div>
        <div class="auth-field">
          <label class="auth-check" style="margin-top: auto; height: 48px; align-items: center;">
            <input type="checkbox">
            <span class="auth-check__box"></span>
            <span>Продлить на месяц</span>
          </label>
        </div>
      </div>
      <div class="auth-row">
        <div class="auth-field"><label class="auth-field__label">ФИО, видите только вы</label><input type="text" required></div>
        <div class="auth-field"><label class="auth-field__label">Телефон клиента</label><input type="tel" placeholder="+7 (___) ___-__-__" required></div>
      </div>
      <div class="auth-actions" style="margin-top:14px;">
        <label class="auth-check">
          <input type="checkbox" required>
          <span class="auth-check__box"></span>
          <span style="font-size:11px;">Нажимая на кнопку «Отправить», я соглашаюсь с <a href="#">Политикой обработки персональных данных</a></span>
        </label>
        <button type="submit" class="btn btn--dark">Отправить</button>
      </div>
    </form>
  </div>
</div>

<div class="snackbar" id="snackbar"></div>

<script src="_layout.js"></script>
<script>
mountCabinet('clients');

function toggleFilter() { document.querySelector('.cab-filter').classList.toggle('is-open'); }
function resetFilter() { document.querySelectorAll('.cab-filter input, .cab-filter select').forEach(x => x.value = ''); }

function snackbar(msg, variant='') {
  const el = document.getElementById('snackbar');
  el.textContent = msg;
  el.className = 'snackbar snackbar--visible' + (variant?' snackbar--'+variant:'');
  setTimeout(()=> el.className='snackbar', 3000);
}

const CLIENTS = {
  requests: [
    { name:'Иванов Иван Иванович', phone:'+7 (999) 000-00-02', created:'01.01.25', matches:1 },
    { name:'Иванов Иван Иванович', phone:'+7 (999) 000-00-02', created:'01.01.25', matches:1 },
    { name:'Иванов Иван Иванович', phone:'+7 (999) 000-00-02', created:'01.01.25', matches:0 },
    { name:'Иванов Иван Иванович', phone:'+7 (999) 000-00-02', created:'01.01.25', matches:0 }
  ],
  fixations: [], give: [], take: []
};

// Подгружаем фиксации, отправленные со страницы «Заявка на фиксацию клиента»
try {
  const saved = JSON.parse(localStorage.getItem('delis_fixations') || '[]');
  if (Array.isArray(saved)) CLIENTS.fixations = saved;
} catch (e) {}
// Обновляем счётчик во вкладке «Фиксации»
(function(){
  const tab = document.querySelector('#cl-tabs .cab-text-tab[data-tab="fixations"] .cab-text-tab__count');
  if (tab) tab.textContent = CLIENTS.fixations.length;
})();

function renderClients(tab) {
  const list = CLIENTS[tab] || [];
  const rows = document.getElementById('cl-rows');
  if (!list.length) { rows.innerHTML = `<div class="cab-empty" style="padding:32px;text-align:center;color:#9A9A9F;">В этой категории нет записей</div>`; return; }
  rows.innerHTML = list.map(c => `
    <div class="cl-row">
      <div class="cl-cell cl-cell--name">${c.name}</div>
      <div class="cl-cell cl-cell--phone"><span style="color:#9A9A9F;">Тел.:</span> ${c.phone}</div>
      <div class="cl-cell cl-cell--date"><span style="color:#9A9A9F;">Создан:</span> ${c.created}</div>
      <div class="cl-cell cl-cell--match">${c.status ? `<span class="cl-match-tag">${c.status}</span>` : (c.matches > 0 ? `<span class="cl-match-tag">Подходящих объектов (${c.matches})</span>` : '')}</div>
      <div class="cl-cell cl-cell--act"><button class="cl-edit-btn" title="Редактировать"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg></button></div>
    </div>
  `).join('');
}
function activateTab(tab) {
  document.querySelectorAll('#cl-tabs .cab-text-tab').forEach(x =>
    x.classList.toggle('cab-text-tab--active', x.dataset.tab === tab));
  renderClients(tab);
}
document.querySelectorAll('#cl-tabs .cab-text-tab').forEach(t =>
  t.addEventListener('click', () => activateTab(t.dataset.tab)));

// Если пришли с ?tab=fixations — открываем нужную вкладку
const _startTab = new URLSearchParams(location.search).get('tab');
activateTab(_startTab && CLIENTS[_startTab] ? _startTab : 'requests');

// === Modal ===
function openAddClient()    { showModalTab('create'); }
function openSelectClient() { showModalTab('select'); }
function closeClientModal() { document.getElementById('modal-client').classList.remove('is-open'); }
function showModalTab(tab) {
  document.getElementById('modal-client').classList.add('is-open');
  document.querySelectorAll('.cab-modal__tab').forEach(t => t.classList.toggle('cab-modal__tab--active', t.dataset.mtab === tab));
  document.querySelectorAll('[data-modal-tab]').forEach(f => f.style.display = f.dataset.modalTab === tab ? '' : 'none');
}
document.querySelectorAll('.cab-modal__tab').forEach(t => t.addEventListener('click', () => showModalTab(t.dataset.mtab)));
document.getElementById('modal-client').addEventListener('click', (e) => {
  if (e.target.id === 'modal-client') closeClientModal();
});

function submitCreateClient(e) {
  e.preventDefault();
  const f = new FormData(e.target);
  // Валидация имени: должно начинаться с заглавной кириллической
  const firstWrap = e.target.querySelector('input[name="first"]').closest('.auth-field');
  if (!/^[А-ЯЁ][а-яё-]+$/.test(f.get('first'))) {
    firstWrap.classList.add('auth-field--error');
    snackbar('Некорректное имя', 'error');
    return;
  }
  firstWrap.classList.remove('auth-field--error');
  CLIENTS.requests.unshift({
    name: `${f.get('last')} ${f.get('first')}${f.get('middle') ? ' '+f.get('middle') : ''}`,
    phone: f.get('phone'), budget: '—', fixedTo: '—', status: 'active'
  });
  renderClients('requests');
  closeClientModal();
  snackbar('Клиент создан', 'success');
  e.target.reset();
}
function submitSelectClient(e) {
  e.preventDefault();
  closeClientModal();
  snackbar('Запрос отправлен', 'success');
}
// Очистка ошибки при вводе
document.addEventListener('input', (e) => {
  const w = e.target.closest('.auth-field');
  if (w?.classList.contains('auth-field--error') && e.target.value.trim()) w.classList.remove('auth-field--error');
});
</script>
</body>
</html>
